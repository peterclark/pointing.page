version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Grouping keeps the review queue manageable; security updates still
      # arrive as their own PRs regardless of grouping.
      radix:
        patterns: ["@radix-ui/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "typescript"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]

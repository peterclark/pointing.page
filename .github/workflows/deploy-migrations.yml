name: Deploy Database Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

# Migrations are not safe to apply concurrently; queue them instead of
# cancelling, so no push lands without its migrations being applied.
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    # Lets you require an approval (and scope the secrets) in repo settings.
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Replaces a hand-rolled curl of a release asset, which fetched an
      # unpinned "latest" build from a URL that no longer matches Supabase's
      # published asset names.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Logged before applying, so a failed run shows exactly what was pending.
      - name: Show pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
